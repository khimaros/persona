hub = "0.0.0.0:4280"

[profile.persona]
harnesses = ["pi"]
cwd = "/work"
expose = { admin = "/admin", chat = "/chat", "omni" = "/omni", voice = "/voice", touch = "/touch", ramble = "/ramble", canvas = "/canvas", workspace = "/workspace" }
name = "per"

[profile.persona.harness.pi]
builtin_tools = ["read", "find", "ls", "grep", "bash"]
scratch_dir = "/tmp/pi-output"
[profile.persona.harness.opencode]
builtin_tools = ["read", "grep", "glob", "bash"]

[profile.persona.identity]
trust_headers = true
single_user = true
single_user_name = "human"
single_user_display_name = "Human"

[[profile.persona.spokes]]
kind = "workspace"

[[profile.persona.spokes]]
kind = "traits"

[[profile.persona.spokes]]
kind = "admin"

[[profile.persona.spokes]]
kind = "chat"

[[profile.persona.spokes]]
kind = "omni"

[[profile.persona.spokes]]
kind = "ramble"

[[profile.persona.spokes]]
kind = "touch"

[[profile.persona.spokes]]
kind = "voice"

[[profile.persona.spokes]]
kind = "canvas"

[[profile.persona.spokes]]
kind = "opencode"

[[profile.persona.spokes]]
kind = "hcp"
heartbeat_agent = "per"
heartbeat_cleanup = "new"
heartbeat_cleanup_count = 100
heartbeat_every_secs = 1800
#dynamic_tools = "add"
reload_tools = true

[[profile.persona.spokes]]
kind = "bridge"
bridge = { agent = "per", default_trigger = "mention", cleanup = "compact", cleanup_tokens = 100000 }

[[profile.persona.spokes]]
kind = "federation"
[profile.persona.spokes.federation]
substrates = ["veilid", "https"]
tools = "manage"
verify = "tofu"

[[profile.persona.spokes]]
kind = "permission"
#tools = true
[profile.persona.spokes.permission.tools]
"*"                    = "disable"
"trait_*"              = "allow"
"bridge_*"             = "allow"
"hcp_*"                = "allow"
"persona_*"            = "allow"
"touch_*"              = "allow"
"canvas_*"             = "allow"
"federation_peers"     = "allow"
"federation_task"      = "allow"
"federation_ask"       = "ask"
"federation_invite"    = "ask"
"federation_pair"      = "ask"
"federation_verify"    = "ask"
"federation_unpair"    = "ask"
"hcp_hook_write"       = "ask"
"hcp_hook_edit"        = "ask"
"persona_prompt_write" = "ask"
"glob"                 = "allow"
"grep"                 = "allow"
"find"                 = "allow"
"ls"                   = "allow"
[profile.persona.spokes.permission.tools.read]
"*" = "deny"
"/work/config/*" = "allow"
"/work/tests/*" = "allow"
"~/.pi/agent/**" = "allow"
"/tmp/pi-output/**" = "allow"
[profile.persona.spokes.permission.tools.trait_write]
"*" = "allow"
"SOUL.md" = "ask"
[profile.persona.spokes.permission.tools.trait_append]
"*" = "allow"
[profile.persona.spokes.permission.tools.trait_edit]
"*" = "allow"
"SOUL.md" = "ask"
[profile.persona.spokes.permission.tools.trait_delete]
"*" = "allow"
"SOUL.md" = "ask"
[profile.persona.spokes.permission.bash]
"*" = "deny"
"/work/tests/*"        = "allow"
"head *"               = "allow"
"grep *"               = "allow"
"sleep *"              = "allow"
"which *"              = "allow"
"browser-head start"   = "allow"
"browser-head status"  = "allow"
"browser-head stop"    = "deny"
"browser-use*"         = "allow"
"browser-use init*"    = "deny"
"browser-use run*"     = "deny"
"browser-use extract*" = "deny"
"browser-use python*"  = "deny"
"browser-use sessions" = "allow"
"browser-use close"    = "deny"
"browser-use state"    = "allow"
"browser-use back"     = "allow"
"browser-use screenshot*" = "allow"
"browser-use click *"     = "allow"
"browser-use dblclick *"  = "allow"
"browser-use rightclick *" = "allow"
"browser-use hover *"     = "allow"
"browser-use keys *"      = "allow"
"browser-use type *"      = "allow"
"browser-use input *"     = "allow"
"browser-use select *"    = "allow"
"browser-use scroll *"    = "allow"
"browser-use get *"       = "allow"
"browser-use tab *"       = "allow"
"browser-use tab close *" = "ask"
"browser-use open *"      = "allow"
[profile.persona.spokes.permission.external]
"*" = "deny"
"/work/**" = "allow"
"~/.pi/agent/**" = "allow"
"/tmp/pi-output/**" = "allow"
[profile.persona.spokes.permission.identity.federation.tools]
"*" = "disable"
