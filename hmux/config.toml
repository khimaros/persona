hub = "0.0.0.0:4280"

[profile.persona]
harnesses = ["pi"]
cwd = "/work"
expose = { admin = "/admin", chat = "/chat", "omni" = "/omni", voice = "/voice", touch = "/touch", canvas = "/canvas", memory = "/memory" }
name = "per"

[profile.persona.harness.pi]
builtin_tools = ["read", "find", "ls", "grep", "bash"]
scratch_dir = "/tmp/pi-output"
[profile.persona.harness.opencode]
builtin_tools = ["read", "grep", "glob", "bash"]

[profile.persona.identity]
trust_headers = true
single_user = true
single_user_name = "human"
single_user_display_name = "Human"

# the memory face keeps /work: the traits, prompts and hooks, served to me as `memory_*` tools
# and to everything else over http. IT COMES FIRST so the store is up before `hcp` -- which is
# handed its address automatically -- and it is the SOLE WRITER of that directory, which is what
# lets it commit every change and lets its change feed be complete.
[[profile.persona.spokes]]
kind = "memory"

[[profile.persona.spokes]]
kind = "admin"

[[profile.persona.spokes]]
kind = "chat"

[[profile.persona.spokes]]
kind = "omni"

[[profile.persona.spokes]]
kind = "touch"

[[profile.persona.spokes]]
kind = "voice"

[[profile.persona.spokes]]
kind = "canvas"

[[profile.persona.spokes]]
kind = "opencode"

[[profile.persona.spokes]]
kind = "hcp"
heartbeat_agent = "per"
heartbeat_cleanup = "new"
heartbeat_cleanup_count = 100
heartbeat_every_secs = 1800
#dynamic_tools = "add"
reload_tools = true

[[profile.persona.spokes]]
kind = "bridge"
bridge = { agent = "per", default_trigger = "mention", cleanup = "compact", cleanup_tokens = 100000 }

[[profile.persona.spokes]]
kind = "federation"
[profile.persona.spokes.federation]
# no `name` here on purpose: the face inherits `[profile.persona] name`, so the network identity
# and the name the admin renders over the agent's own messages are one value. Setting it here
# again wins over the profile (a face that names itself keeps its own) and is how they drifted --
# this said "per" while the profile said "perseus".
substrates = ["veilid", "https"]
tools = "manage"
verify = "tofu"

[[profile.persona.spokes]]
kind = "permission"
#tools = true
[profile.persona.spokes.permission]
default = "deny"
[profile.persona.spokes.permission.tools]
"memory_*"             = "allow"
"bridge_*"             = "allow"
"hcp_*"                = "allow"
"persona_*"            = "allow"
"touch_*"              = "allow"
"canvas_*"             = "allow"
"federation_peers"     = "allow"
"federation_task"      = "allow"
"federation_ask"       = "ask"
"federation_invite"    = "ask"
"federation_pair"      = "ask"
"federation_verify"    = "ask"
"federation_unpair"    = "ask"
"hcp_hook_write"       = "ask"
"hcp_hook_edit"        = "ask"
"persona_prompt_write" = "ask"
"persona_prompt_edit"  = "ask"
"glob"  = "allow"
"grep"  = "allow"
"find" = "allow"
"ls" = "allow"
[profile.persona.spokes.permission.tools.read]
"*" = "deny"
"/work/config/*" = "allow"
"/work/tests/*" = "allow"
"~/.pi/agent/**" = "allow"
"/tmp/pi-output/**" = "allow"
# EVERY TOOL THAT CAN CHANGE SOUL.md, and the rule is keyed on the PATH the tool takes -- which
# now carries its directory (`traits/SOUL.md`, not `SOUL.md`). a rule keyed on the old bare name
# would not match, and a permission rule that does not match fails OPEN: the gate is simply absent
# and looks exactly like a policy nobody wrote. see docs/MIGRATION.md in the hmux repo.
[profile.persona.spokes.permission.tools.memory_write]
"*" = "allow"
"traits/SOUL.md" = "ask"
[profile.persona.spokes.permission.tools.memory_edit]
"*" = "allow"
"traits/SOUL.md" = "ask"
[profile.persona.spokes.permission.tools.memory_append]
"*" = "allow"
"traits/SOUL.md" = "ask"
[profile.persona.spokes.permission.tools.memory_delete]
"*" = "allow"
"traits/SOUL.md" = "ask"
[profile.persona.spokes.permission.tools.memory_move]
"*" = "allow"
"traits/SOUL.md" = "ask"
[profile.persona.spokes.permission.bash]
"*" = "deny"
"/work/tests/*"        = "allow"
"head *"               = "allow"
"grep *"               = "allow"
"sleep *"              = "allow"
"which *"              = "allow"
"browser-head start"   = "allow"
"browser-head status"  = "allow"
"browser-head stop"    = "deny"
"browser-use*"         = "allow"
"browser-use init*"    = "deny"
"browser-use run*"     = "deny"
"browser-use extract*" = "deny"
"browser-use python*"  = "deny"
"browser-use sessions" = "allow"
"browser-use close"    = "deny"
"browser-use state"    = "allow"
"browser-use back"     = "allow"
"browser-use screenshot*" = "allow"
"browser-use click *"     = "allow"
"browser-use dblclick *"  = "allow"
"browser-use rightclick *" = "allow"
"browser-use hover *"     = "allow"
"browser-use keys *"      = "allow"
"browser-use type *"      = "allow"
"browser-use input *"     = "allow"
"browser-use select *"    = "allow"
"browser-use scroll *"    = "allow"
"browser-use get *"       = "allow"
"browser-use tab *"       = "allow"
"browser-use tab close *" = "ask"
"browser-use open *"      = "allow"
[profile.persona.spokes.permission.external]
"*" = "deny"
"/work/**" = "allow"
"~/.pi/agent/**" = "allow"
"/tmp/pi-output/**" = "allow"
[profile.persona.spokes.permission.identity.federation]
default = "deny"
