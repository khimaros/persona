# eval-only overrides, layered over docker-compose.yml by the `eval` / `eval-bridge` make targets
# (NEVER by `make up`, so the dev container is untouched and keeps its real bridge creds).
#
# CRITICAL SAFETY: the eval MUST NEVER touch the real matrix account. persona.env holds the live
# HMUX_BRIDGE_* credentials via env_file; these EXPLICIT environment values override env_file (an explicit
# key always wins, unlike a bare pass-through whose precedence is compose-implementation-specific).
# Default empty -> the bridge face idles and never connects anywhere. `make eval-bridge` fills them
# from the shell with a THROWAWAY fake homeserver (@per:fake.local on host.containers.internal), so
# even the bridge eval only ever reaches the local fake, never the real server.
services:
  persona:
    # AND THE EVAL RUNS AGAINST THE CHECKED-IN CONFIG. `hmux/config.local.toml` is this box's own
    # policy and is gitignored, so letting it reach an eval would make the result depend on an
    # untracked file -- a score that cannot be reproduced from the repo. pointed at the all-
    # commented example instead of dropped, because compose merges volumes by target and a
    # bind mount of a missing file creates a directory. (`make eval` never runs `make up`, so the
    # real file may not even have been seeded.)
    volumes:
      - ./hmux/config.local.toml.example:/config/config.local.toml:ro
      # AND THE EVAL GETS ITS OWN THROWAWAY /work + /data. the base compose bind-mounts the real
      # ./work and ./data; an eval against those would edit the live workspace (run 1's onboarding
      # deletes BOOTSTRAP.md). named volumes are per-compose-project, so each `persona-eval-<hex>`
      # run gets a fresh pair the entrypoint seeds and `down -v` discards. merged by TARGET, so
      # these replace the bind mounts rather than adding to them.
      - persona-work:/work
      - persona-data:/data
    # let the container reach a fake-matrix on the host (the bridge eval points HMUX_BRIDGE_HOMESERVER at it).
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      - HMUX_BRIDGE_HOMESERVER=${HMUX_BRIDGE_HOMESERVER:-}
      - HMUX_BRIDGE_USER_ID=${HMUX_BRIDGE_USER_ID:-}
      - HMUX_BRIDGE_ACCESS_TOKEN=${HMUX_BRIDGE_ACCESS_TOKEN:-}
      # force headless in evals: the base compose forwards the dev's $DISPLAY, but eval browser
      # tests must stay headless (deterministic, no window popping up on the dev's desktop).
      - DISPLAY=

volumes:
  persona-work:
  persona-data:
