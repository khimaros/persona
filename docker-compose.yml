# persona: one container running `hmux up persona` (pi backend + admin/omni/opencode
# faces). runs under `podman compose` (the default -- keep-id gives headed browsing) or
# `docker compose` (which has no keep-id, so delete the `userns_mode` line -- see the note
# on it). get the base image (khimaros/hmux) from the hmux repo or a registry, then
# `docker compose up --build`. see HMUX.md.
#
# the settings HERE are the ones compose needs before the container exists -- published ports,
# where /work and /data live, the uid. they are interpolation, so they come from your shell or
# this file's defaults; an env_file cannot reach them, which is why they are not in persona.env.
# everything the CONTAINER reads is in persona.env instead.

services:
  persona:
    build:
      context: .
      # the two images persona is mixed from. named EXPLICITLY (the Makefile passes
      # localhost/-qualified refs under podman) because a bare `khimaros/hmux:latest` is
      # ambiguous once a docker.io/ tag of the same name exists locally, and the resolver
      # silently preferred the older remote-tagged one.
      args:
        HMUX_IMAGE: ${HMUX_IMAGE:-khimaros/hmux:latest}
        BROWSER_USE_IMAGE: ${BROWSER_USE_IMAGE:-khimaros/browser-use:latest}
    image: khimaros/persona:latest
    # defaults to `persona`; the eval overrides it (with a matching COMPOSE_PROJECT_NAME)
    # to give each run a uniquely named container + fresh volumes. see the Makefile eval target.
    container_name: ${PERSONA_CONTAINER:-persona}
    command: ["hmux", "up", "persona"]
    restart: unless-stopped
    # run the container AS the hmux user (uid 1000), and under rootless podman map that uid to your
    # HOST uid via keep-id. together this makes the container's hmux == you on the host, so a non-root
    # (sandboxed) chrome can reach the host X11 socket (owned by you, mode 0775) for headed browsing,
    # and the host-owned volumes + config mounts are directly ours (no chown/drop needed -- hmux-drop
    # becomes a passthrough). PERSONA_UID/GID default to 1000; set them to your `id -u`/`id -g` if
    # different. NOTE: `userns_mode: keep-id` is podman-only; on docker, drop it (docker maps the
    # container user to the host uid directly) or run rootless docker.
    user: "${PERSONA_UID:-1000}:${PERSONA_GID:-1000}"
    userns_mode: "keep-id:uid=${PERSONA_UID:-1000},gid=${PERSONA_GID:-1000}"
    # ONE published port. every ui is reached through the hub's own port at the mount named in
    # hmux/config.toml's `expose` (/admin, /chat, /omni, /voice), so the per-face publishes below
    # are redundant -- uncomment one only to reach that face directly. the eval overrides the hub
    # port from its shell (PERSONA_HUB_PORT -> a random free port) so a run never collides with,
    # or has to shut down, the developer's own `persona` container. see the Makefile eval target.
    ports:
      - "${PERSONA_HUB_PORT:-4280}:4280"     # hub (the browser dials this; every face hangs off it)
      #- "${PERSONA_ADMIN_PORT:-4282}:4282"   # admin  (also at /admin)
      #- "${PERSONA_OMNI_PORT:-4284}:4284"    # omni   (also at /omni)
      #- "${PERSONA_CHAT_PORT:-4290}:4290"    # chat   (also at /chat)
      # the opencode face has no `expose` mount: an `opencode attach` TUI dials a base url, which a
      # path-prefixed proxy has not been tested against. publish it to use `make attach`.
      #- "${PERSONA_FACE_PORT:-4096}:4096"    # opencode face (tui `opencode attach`)
      #- "${PERSONA_CANVAS_PORT:-4294}:4294"  # canvas (also at /canvas)
    volumes:
      # HOST directories beside this file, not named volumes: everything persona has become is
      # then readable, greppable and backed up without going through the container -- and it
      # survives a `down -v`, which is how a deploy that prunes wiped the agent's memory. both
      # are gitignored. the eval replaces them with throwaway named volumes, since an eval run
      # must never write the real workspace (see docker-compose.eval.yml).
      - ./data:/data                                 # HOME: pi config, auth, sessions
      - ./work:/work                                 # workspace (traits/hooks/prompts/...)
      - ./hmux/config.local.toml:/config/config.local.toml:ro
      # the host X11 socket: with $DISPLAY forwarded (below) the container's chrome renders on
      # your desktop, so `make browser-head` opens a HEADED, shared browser. harmless when the
      # host has no X (an empty $DISPLAY keeps browser-use headless). see the browser-head target.
      - /tmp/.X11-unix:/tmp/.X11-unix
      # your pi agent config (providers, enabled models, auth); copied into /data at boot.
      - ${HOME}/.pi/agent/models.json:/config/models.json:ro
      - ${HOME}/.pi/agent/settings.json:/config/settings.json:ro
      - ${HOME}/.pi/agent/auth.json:/config/auth.json:ro
    # runtime-specific env (secrets + host bits): copy persona.env.example -> persona.env
    # (gitignored) and fill it in. optional -- without it the container still boots and the
    # voice/bridge faces just idle. values here are overridden by anything in `environment:`.
    # NOTE: the short form is the COMPATIBLE one, and the file must therefore exist -- `make up`
    # seeds it from persona.env.example on first run. the long form is what we actually want
    # (`- path: ./persona.env` + `required: false`, which makes it optional and drops the seeding
    # step), but it needs docker Compose v2.24+ / a recent podman-compose; switch once every
    # deploy host is there.
    env_file: ./persona.env
    environment:
      - HMUX_HCP_HEARTBEAT_ENABLED      # heartbeat on/off; set false to disable (the eval sets this)
      # speech is the VOICE FACE's (HMUX_VOICE_* in persona.env), not omni's: omni relays to it
      # and carries no stt/tts of its own.
      # your desktop display: forwarded so `make browser-head` (and any browser-use call) can render
      # a headed chrome on it, shared with the agent. empty when the host has no X -> stays headless.
      # the eval overrides this back to empty so eval browser tests never open a window (see eval yml).
      - DISPLAY=${DISPLAY:-}
      # THE CONTAINER'S OWN DISPLAY, when none is forwarded above: the entrypoint starts an Xvfb on
      # it and the canvas face serves it at /canvas, so the browser Per drives is one you can watch
      # and take the mouse on. both are optional -- empty means the defaults (:88, 1280x800x24).
      #
      # :88 AND NOT :99 because /tmp/.X11-unix is bind-mounted below, which makes the display
      # NUMBER a namespace shared with your host -- and :99 is exactly what an `xvfb-run` on your
      # machine takes first. set PERSONA_DISPLAY if :88 collides too.
      - PERSONA_DISPLAY=${PERSONA_DISPLAY:-}
      - PERSONA_SCREEN=${PERSONA_SCREEN:-}
      # host-specific / secret runtime env (incl. the matrix bridge HMUX_BRIDGE_* vars) comes from
      # persona.env. the eval NEVER inherits those: docker-compose.eval.yml (used only by the eval
      # targets, never `make up`) overrides HMUX_BRIDGE_* with explicit safe values. see that file.
